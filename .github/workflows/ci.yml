name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to validate (defaults to the caller commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify no dependency install is needed
        run: test ! -d node_modules

      - name: Run tests
        run: npm test

      - name: Check module imports
        run: node --experimental-strip-types -e "await import('./src/proxy-manager.ts')"

      - name: Check package contents
        run: npm pack --dry-run
